server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: drools-ai-platform
  # 数据库连接信息通过环境变量注入，切勿把真实账号密码提交到代码仓库
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:drools_ai_platform}?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  # 启动时自动执行 schema.sql / data.sql 初始化表结构
  # 注意：schema.sql 含 DROP TABLE，always 模式下每次启动都会清空规则数据；
  # 需要保留数据时设置环境变量 SQL_INIT_MODE=never
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: false
      encoding: UTF-8

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.biz.rule.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# Drools 平台配置
rule-platform:
  sandbox-session-timeout: 60
  max-fire-rules: 10000
  max-entity-cache: 200

# 智谱AI LLM 配置（GLM-4-Flash 永久免费）
# 注册拿 Key: https://open.bigmodel.cn → 控制台 → API Keys
# api-key 通过环境变量 LLM_API_KEY 注入；当 llm_config 表中的 api_key 为空或为占位符
# YOUR_ZHIPU_API_KEY 时，LlmService 会使用这里的值
llm:
  base-url: https://open.bigmodel.cn/api/paas/v4/chat/completions
  api-key: ${LLM_API_KEY:}
  model: glm-4-flash
  timeout-seconds: 60
  max-retries: 2

logging:
  level:
    com.biz.rule: debug
    org.drools: warn
